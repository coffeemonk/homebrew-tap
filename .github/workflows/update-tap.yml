name: Update Tap Packages

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sundays at midnight UTC
  workflow_dispatch:     # Manual trigger via GitHub UI / CLI
    inputs:
      target:
        description: 'Package to update'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - workflowy-cli
          - comictagger
          - comictagger@beta
          - darktable
          - kindle-comic-converter
          - makemkv

jobs:
  update-tap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check for new releases & update tap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET="${{ inputs.target || 'all' }}"
          python3 .github/scripts/update_tap.py "$TARGET"

      - name: Commit and push changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add formula/ Casks/
            git commit -m "Automated update of tap packages"
            git push
          else
            echo "No changes to commit. Tap is up to date."
          fi
